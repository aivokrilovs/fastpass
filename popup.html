<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastPass</title>
  <style>
    :root {
      color-scheme: light dark;

      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #dadce0;
      --text: #202124;
      --text-secondary: #5f6368;
      --text-muted: #80868b;

      --accent: #fb542b;
      --accent-hover: #e0441d;
      --accent-active: #c73714;

      --btn-bg: #f1f3f4;
      --btn-hover: #e8eaed;
      --btn-active: #dadce0;
      --btn-border: #dadce0;
      --btn-text: #3c4043;

      --danger-bg: #fce8e6;
      --danger-hover: #fad2cf;
      --danger-border: #f5c2c7;
      --danger-text: #c5221f;

      --totp-bg: #e6f4ea;
      --totp-border: #ceead6;
      --totp-text: #137333;
      --totp-badge: #ceead6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e24;
        --surface: #2b2b36;
        --border: #3e3e4f;
        --text: #f1f1f4;
        --text-secondary: #9e9ea7;
        --text-muted: #737380;

        --accent-hover: #ff6e4a;
        --accent-active: #e0441d;

        --btn-bg: #383846;
        --btn-hover: #454556;
        --btn-active: #4e4e61;
        --btn-border: #4e4e61;
        --btn-text: #f1f1f4;

        --danger-bg: #3c1f24;
        --danger-hover: #4d262c;
        --danger-border: #5c2b30;
        --danger-text: #f28b82;

        --totp-bg: #172b1d;
        --totp-border: #23492b;
        --totp-text: #81c995;
        --totp-badge: #23492b;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      min-width: 320px;
      height: 100%;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg);
      padding: 16px;
      max-width: 460px;
      margin: 0 auto;
      overflow-y: auto;
    }
    h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .card-row:last-child {
      margin-bottom: 0;
    }
    .card-actions {
      margin-top: 8px;
      justify-content: flex-end;
    }
    .label {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 11px;
    }
    .value {
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: var(--text);
    }
    .value.strong {
      font-weight: 700;
    }
    .value.muted {
      color: var(--text-muted);
    }
    .value.danger {
      color: var(--danger-text);
    }
    .pass-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* credential card + reorder arrows */
    .cred-wrap {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .cred-wrap .card {
      flex: 1;
    }
    .arrows {
      position: absolute;
      right: -13px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .arrow {
      cursor: pointer;
      font-size: 10px;
      line-height: 1;
      color: var(--text-muted);
      user-select: none;
    }
    .arrow:hover {
      color: var(--text);
    }

    /* TOTP */
    .totp-box {
      background: var(--totp-bg);
      border: 1px solid var(--totp-border);
      border-radius: 4px;
      padding: 6px 8px;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .totp-label {
      font-weight: 600;
      color: var(--totp-text);
      font-size: 11px;
    }
    .totp-code {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--totp-text);
    }
    .totp-timer {
      font-size: 11px;
      font-weight: 600;
      color: var(--totp-text);
      background: var(--totp-badge);
      padding: 2px 5px;
      border-radius: 3px;
    }
    .totp-secret-row {
      margin-top: 4px;
      font-family: monospace;
      font-size: 11px;
      word-break: break-all;
      color: var(--text-secondary);
    }

    /* buttons */
    .btn {
      font-size: 11px;
      padding: 4px 8px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-text);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover {
      background: var(--btn-hover);
    }
    .btn:active {
      background: var(--btn-active);
    }
    .btn-danger {
      color: var(--danger-text);
      border-color: var(--danger-border);
      background: var(--danger-bg);
    }
    .btn-danger:hover {
      background: var(--danger-hover);
    }
    .btn-danger.armed {
      background: var(--danger-text);
      border-color: var(--danger-text);
      color: #ffffff;
      font-weight: 700;
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent-hover);
      font-weight: 600;
      padding: 7px 12px;
      width: 100%;
      margin-top: 6px;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-primary:active {
      background: var(--accent-active);
    }

    /* add form */
    form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 8px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }
    .form-group input {
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-group input:focus {
      border-color: var(--accent);
    }
    .input-with-action {
      display: flex;
      gap: 4px;
    }
    .input-with-action input {
      flex: 1;
    }

    #status-msg {
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      display: none;
    }
    .status-success {
      background: var(--totp-bg);
      color: var(--totp-text);
      border: 1px solid var(--totp-border);
    }
    .status-error {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
    }
    .empty-state {
      font-style: italic;
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 0;
    }

    /* backup */
    #export-area {
      width: 100%;
      min-height: 90px;
      padding: 6px 8px;
      font-family: monospace;
      font-size: 11px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 4px;
      outline: none;
      resize: vertical;
      scrollbar-width: none;
    }
    #export-area::-webkit-scrollbar {
      display: none;
    }
    #export-area:focus {
      border-color: var(--accent);
    }
    .backup-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      justify-content: center;
      align-items: center;
    }
    #import-go-row {
      text-align: right;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <!-- ADD CREDENTIAL FORM -->
  <section>
    <h2>Add Credential</h2>
    <form id="add-form">
      <div class="form-group">
        <label for="domain-input">Domain</label>
        <input type="text" id="domain-input" placeholder="example.com,example.co.uk" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="username-input">Username / Email</label>
        <input type="text" id="username-input" placeholder="user@example.com" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="password-input">Password</label>
        <div class="input-with-action">
          <input type="password" id="password-input" placeholder="Password" autocomplete="off">
          <button type="button" class="btn" id="toggle-form-pass-btn">Show</button>
          <button type="button" class="btn" id="gen-pass-btn" title="Generate strong random password">Gen</button>
        </div>
      </div>
      <div class="form-group">
        <label for="totp-input">TOTP Secret</label>
        <input type="text" id="totp-input" placeholder="e.g. JBSWY3DPEHPK3PXP" autocomplete="off">
      </div>
      <button type="submit" class="btn btn-primary">Save Credential</button>
      <div id="status-msg"></div>
    </form>
  </section>

  <!-- SAVED LOGINS -->
  <section>
    <h2 id="saved-title">Saved Passwords</h2>
    <div id="credentials-list">
      <div class="empty-state">Loading...</div>
    </div>
  </section>

  <!-- BACKUP (EXPORT / IMPORT) -->
  <section>
    <div class="backup-actions">
      <button type="button" class="btn" id="export-btn">Export</button>
      <button type="button" class="btn" id="import-btn">Import</button>
    </div>
    <textarea id="export-area" hidden></textarea>
    <div id="import-go-row" hidden>
      <button type="button" class="btn" id="import-go-btn">Import</button>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
